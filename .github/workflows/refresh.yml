name: refresh board

on:
  schedule:
    - cron: "17,37,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published site (rolling state lives there)
        run: |
          git fetch origin gh-pages --depth=1 || true
          mkdir -p pub
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git --work-tree=pub checkout origin/gh-pages -- . && git reset -q
          fi
          ls -la pub

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q requests

      - name: Refresh
        run: python -m edge.refresh --data pub

      - name: Publish
        run: |
          cp site/index.html pub/index.html
          cp site/manifest.webmanifest pub/ 2>/dev/null || true
          touch pub/.nojekyll
          cd pub
          git init -q -b gh-pages
          git config user.name "soccer-edge bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "board $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages && break; echo "push failed, retrying"; sleep $((i * 15)); done

      # GitHub's cron fires late and irregularly (twice in 13 hours on 2026-11-03/04). So every run starts the next one
      # 15 minutes later unless another run is already waiting; a scheduled run that does fire just joins the queue,
      # and only one chain survives because a run that finds another queued run stops chaining.
      - name: Start the next refresh
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others() {
            gh run list -R "${{ github.repository }}" -w "refresh board" -L 20 --json databaseId,status               --jq '[.[] | select(.databaseId != ${{ github.run_id }} and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested"))] | length'
          }
          if [ "$(others)" -gt 0 ]; then echo "another run is waiting; not chaining"; exit 0; fi
          sleep 900
          if [ "$(others)" -gt 0 ]; then echo "another run started meanwhile; not chaining"; exit 0; fi
          gh workflow run refresh.yml -R "${{ github.repository }}" --ref main
