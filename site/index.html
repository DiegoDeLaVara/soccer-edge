<html lang="en"><head><meta charset="utf-8">

<style>
/* Layout: a matchday board. Sticky day/filter bar, league sections, two-line fixture rows that expand in place. */
:root {
  --bg: #f2f5f1; --surface: #ffffff; --ink: #15201a; --muted: #5b6a61; --line: #dbe3dd;
  --home: #1c6a46; --draw: #8a958e; --away: #ad5e1e;
  --signal: #9a5600; --signal-soft: #fbefd9; --alert: #b3261a; --alert-soft: #fbe7e4;
  --good: #1b7a44; --chip: #e8eee9;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1310; --surface: #161d19; --ink: #e4ebe6; --muted: #93a29a; --line: #27322c;
    --home: #4dbf89; --draw: #6c7871; --away: #e2a064;
    --signal: #f0b350; --signal-soft: #3a2c12; --alert: #ff8b7e; --alert-soft: #3b1d1a;
    --good: #5fd196; --chip: #1f2823; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1310; --surface: #161d19; --ink: #e4ebe6; --muted: #93a29a; --line: #27322c;
  --home: #4dbf89; --draw: #6c7871; --away: #e2a064;
  --signal: #f0b350; --signal-soft: #3a2c12; --alert: #ff8b7e; --alert-soft: #3b1d1a;
  --good: #5fd196; --chip: #1f2823; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h1 { font: 700 26px/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button, .chips button { font: 600 14px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { background: var(--chip); padding: 5px 11px; border-radius: 999px; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#q { flex: 1 1 160px; min-width: 0; font: 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
button:focus-visible, #q:focus-visible, .row:focus-visible { outline: 2px solid var(--home); outline-offset: 2px; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); padding-block: 12px 4px; }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
section.league { margin-top: 18px; }
.lh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 6px; }
.lh h2 { font: 600 17px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.lh span { font-size: 12px; color: var(--muted); }
.games { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.game + .game { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 54px minmax(0, 1fr) 76px; gap: 10px; padding: 10px 12px; cursor: pointer; align-items: center; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; }
.time { font: 600 15px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.time small { display: block; font: 400 11px var(--body); color: var(--muted); }
.live { color: var(--alert); }
.teams { min-width: 0; display: grid; gap: 2px; }
.team { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.team .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.team.fav .nm { font-weight: 700; }
.team .sc { font: 700 17px var(--display); font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
.tag { font-size: 11.5px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag.sig { background: var(--signal-soft); color: var(--signal); font-weight: 700; }
.tag.sig.high { background: var(--alert-soft); color: var(--alert); }
.tag.hit { color: var(--good); } .tag.miss { color: var(--alert); }
.pickcol { text-align: right; }
.pickcol b { display: block; font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.pickcol span { font-size: 11px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 5px; }
.bar i { display: block; height: 100%; }
.bar .h, .k.h { background: var(--home); } .bar .d, .k.d { background: var(--draw); } .bar .a, .k.a { background: var(--away); }
.detail { padding: 4px 12px 16px; display: grid; gap: 16px; border-top: 1px dashed var(--line); }
.detail h3 { font: 600 14px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 6px; }
.probs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.prob { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.prob small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.prob b { font: 700 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.k { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-block: 4px; font-size: 14px; min-width: 0; }
.kv div span { color: var(--muted); }
.kv div b { font-variant-numeric: tabular-nums; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; white-space: nowrap; }
.sigs { display: grid; gap: 8px; }
.sigcard { border-left: 3px solid var(--signal); background: var(--signal-soft); border-radius: 0 8px 8px 0; padding: 7px 10px; }
.sigcard.high { border-left-color: var(--alert); background: var(--alert-soft); }
.sigcard b { display: block; font-size: 14px; }
.sigcard span { font-size: 13px; color: var(--ink); opacity: .85; }
.sigcard .fav { display: inline-block; margin: 0 0 3px; font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .03em; color: var(--signal); }
.sigcard.high .fav { color: var(--alert); }
.sigcard .means { display: block; margin-top: 4px; opacity: 1; }
.lean { font-size: 13.5px; margin: 0 0 8px; }
.tag.pick { color: var(--home); font-weight: 700; }
.tag.pick.strong { background: var(--home); color: var(--surface); }
.pk td:first-child { font-weight: 600; }
.pk .tier { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.pos { color: var(--good); font-weight: 700; } .negv { color: var(--alert); }
.tag.kal { background: var(--good); color: var(--surface); font-weight: 700; }
.rate { display: inline-block; font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .04em; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.rate.v { background: var(--good); color: var(--surface); }
.rate.f { background: var(--chip); color: var(--ink); }
.rate.o { background: var(--alert-soft); color: var(--alert); }
.tag.bet { background: var(--good); color: var(--surface); font-weight: 700; }
.tag.bet.f { background: var(--chip); color: var(--ink); }
.betcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px; cursor: pointer; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; }
.betcard .what { font: 700 18px/1.15 var(--display); }
.betcard .game { font-size: 13px; color: var(--muted); }
.betcard .nums { text-align: right; font-variant-numeric: tabular-nums; }
.betcard .nums b { display: block; font: 700 20px/1 var(--display); }
.betcard .nums span { font-size: 11.5px; color: var(--muted); }
.betcard .where { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.rank { font: 700 13px var(--display); color: var(--muted); margin-right: 6px; }
.combo { display: grid; gap: 10px; min-width: 0; }
.detail > * { min-width: 0; }
.legs { display: flex; flex-wrap: wrap; gap: 6px; }
.legs label { font-size: 13px; background: var(--chip); border-radius: 999px; padding: 4px 10px; cursor: pointer; user-select: none; }
.legs label:has(input:checked) { background: var(--home); color: var(--surface); }
.legs input { display: none; }
.legs .grp { width: 100%; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 4px; }
.cres { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.cres div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.cres small { display: block; font-size: 11.5px; color: var(--muted); }
.cres b { font: 700 20px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.quote { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.quote input { width: 92px; font: 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.verdict { border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.4; }
.verdict b.big { display: block; font: 700 22px/1.1 var(--display); letter-spacing: .02em; margin-bottom: 2px; }
.verdict.take { background: var(--good); color: var(--surface); }
.verdict.meh { background: var(--signal-soft); color: var(--signal); }
.verdict.skip { background: var(--alert-soft); color: var(--alert); }
.verdict.rule { background: var(--chip); color: var(--ink); }
.steps { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.combos h2 { font: 600 17px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 22px 2px 8px; }
.ccard { padding: 11px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; cursor: pointer; }
.ccard .what { font: 700 16px/1.2 var(--display); }
.ccard .game { font-size: 12.5px; color: var(--muted); }
.ccard .px { text-align: right; font-variant-numeric: tabular-nums; }
.ccard .px b { display: block; font: 700 18px/1 var(--display); color: var(--good); }
.ccard .px span { font-size: 11px; color: var(--muted); }
.mf h2 { font: 600 17px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 22px 2px 8px; }
.mf .row2 { padding: 11px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
.mf .what { font: 700 16px/1.2 var(--display); }
.mf .sub { font-size: 12.5px; color: var(--muted); }
.mf .px { text-align: right; font-variant-numeric: tabular-nums; }
.mf .px b { display: block; font: 700 18px/1 var(--display); color: var(--good); }
.mf .px span { font-size: 11px; color: var(--muted); }
.mf .inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; margin-top: 10px; }
.mf .inputs input, .mf .inputs select { font: 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.mf .inputs input { width: 100px; }
.mf .big { font: 700 26px/1.1 var(--display); color: var(--good); }
.topnote { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
ul.facts { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.res { display: inline-block; width: 18px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--surface); }
.res.W { background: var(--good); } .res.D { background: var(--draw); } .res.L { background: var(--alert); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
.two > div { min-width: 0; }
.note { font-size: 12.5px; color: var(--muted); }
.record { margin-top: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.record h2 { font: 600 17px var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.padd { font: 13px var(--body); color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.padd.on { background: var(--home); color: var(--surface); }
.padd.on .note { color: inherit; opacity: .85; }
#pbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 16px; font: 600 14px var(--body); box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
.pk2 td { vertical-align: top; }
.prem { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
.updated { white-space: normal; text-align: right; min-width: 0; }
.weak { color: var(--alert); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
@media (prefers-reduced-motion: no-preference) { .detail { animation: open .18s ease-out; } @keyframes open { from { opacity: .3; transform: translateY(-3px); } } }
</style>

<header><div class="wrap">
  <div class="titlebar"><h1>Soccer Edge</h1><span class="updated" id="updated"></span></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Day" id="days"></div>
    <div class="chips" role="group" aria-label="Filter" id="chips">
      <button data-f="money" aria-pressed="true">🔒 Locks & +EV</button>
      <button data-f="best" aria-pressed="false">💰 Best bets</button>
      <button data-f="all" aria-pressed="false">All</button>
      <button data-f="top" aria-pressed="false">★ Top picks</button>
      <button data-f="kal" aria-pressed="false">Kalshi</button>

      <button data-f="big" aria-pressed="false">Big leagues</button>

      <button data-f="parlay" aria-pressed="false">🧾 Parlay</button>

</div></header>

<main class="wrap">
  <div class="summary" id="summary"></div>
  <div id="board"></div>
  <div class="record" id="record"></div>
</main>
<button id="pbar" hidden></button>

<script>document.write('<script src="data.js?t=' + Math.floor(Date.now() / 60000) + '"><\/script>')</script>
<script type="application/json" id="data">null</script>
<script>
// data: data.js (artifact build: window.BOARD) or baked in (the PC's /phone page)
let D = window.BOARD || JSON.parse(document.getElementById("data").textContent) || { generated: 0, days: {}, big: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = (p, d = 0) => p == null ? "—" : (p * 100).toFixed(d) + "%";
const f2 = x => x == null ? "—" : (+x).toFixed(2);
const LIVE = s => /IN_PROGRESS|HALFTIME|FIRST_HALF|SECOND_HALF|EXTRA_TIME|SHOOTOUT/.test(s || "");
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// labels and the default day come from the viewer's clock, not from the order of the data (old data != today)
const ymd = t => { const x = new Date(t); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const TODAY = () => ymd(Date.now()), TOMORROW = () => ymd(Date.now() + 864e5);
const pickDay = () => { const ds = Object.keys(D.days); return ds.find(d => d >= TODAY()) || ds[ds.length - 1]; };
// the cloud build has no Odds API key, so no money-finder tab: start on best bets
if (!D.ev) { const b = document.querySelector('#chips button[data-f="money"]'); if (b) b.remove(); }
const state = { day: pickDay(), f: (f => !D.ev && f === "money" ? "best" : f)(store.get("sp_filter", D.ev ? "money" : "best")), q: "", open: new Set(), relay: "", combo: {}, quote: {} };

function dayLabel(d) { return d === TODAY() ? "Today" : d === TOMORROW() ? "Tomorrow" : d === ymd(Date.now() - 864e5) ? "Yesterday" : new Date(d + "T12:00:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
function renderHead() {
  const days = Object.keys(D.days);
  if (!days.includes(state.day) || (state.day < TODAY() && days.some(d => d >= TODAY()))) state.day = pickDay();
  $("days").innerHTML = days.map((d, i) => `<button data-d="${d}" aria-pressed="${d === state.day}">${dayLabel(d)} <span class="note">${D.days[d].length}</span></button>`).join("");
  const age = (Date.now() / 1000 - D.generated) / 3600;
  $("updated").textContent = "Updated " + new Date(D.generated * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) + (state.relay ? " · " + state.relay : "")
    + (age > 3 ? ` · ⚠ ${Math.round(age)} h old: ${D.cloud ? "the cloud update is late" : "the PC is asleep or the app is off"}` : "");
}

// the side most signals point to: [label, count], or null when they split evenly
function signalLean(fl) {
  const c = {};
  fl.forEach(f => { if (f[3]) c[f[3]] = (c[f[3]] || 0) + 1; });
  const e = Object.entries(c).sort((a, b) => b[1] - a[1]);
  return e.length && (e.length === 1 || e[0][1] > e[1][1]) ? e[0] : null;
}
const rateCls = r => r === "Value" ? "v" : r === "Fair price" ? "f" : "o";
const evTxt = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
// ---- combo calculator: exact joint probabilities from the model's score grid (Poisson + low-score fix)
const LEGS = [
  ["Result", [["H", "{h} win", (h, a) => h > a], ["D", "Draw", (h, a) => h === a], ["A", "{a} win", (h, a) => a > h],
              ["1X", "{h} or draw", (h, a) => h >= a], ["X2", "{a} or draw", (h, a) => a >= h], ["12", "No draw", (h, a) => h !== a]]],
  ["Goals", [["o15", "Over 1.5", (h, a) => h + a > 1], ["o25", "Over 2.5", (h, a) => h + a > 2], ["o35", "Over 3.5", (h, a) => h + a > 3],
             ["u15", "Under 1.5", (h, a) => h + a < 2], ["u25", "Under 2.5", (h, a) => h + a < 3], ["u35", "Under 3.5", (h, a) => h + a < 4]]],
  ["Both teams score", [["by", "BTTS yes", (h, a) => h > 0 && a > 0], ["bn", "BTTS no", (h, a) => h === 0 || a === 0]]],
  ["Teams", [["hs", "{h} scores", (h, a) => h > 0], ["as", "{a} scores", (h, a) => a > 0], ["h2", "{h} 2+ goals", (h, a) => h > 1], ["a2", "{a} 2+ goals", (h, a) => a > 1],
             ["hcs", "{h} clean sheet", (h, a) => a === 0], ["acs", "{a} clean sheet", (h, a) => h === 0],
             ["hm2", "{h} by 2+", (h, a) => h - a >= 2], ["am2", "{a} by 2+", (h, a) => a - h >= 2]]],
];

  }

  const ideas = [["by", "o25"], [g.p.H >= g.p.A ? "H" : "A", "o25"], ["D", "u25"], [g.p.H >= g.p.A ? "H" : "A", "bn"], [g.p.H >= g.p.A ? "1X" : "X2", "u35"]]
    .map(ks => { const ls = ks.map(k => LEGMAP[k]); const j = prob(G, ls.map(l => l[2])), i = ls.reduce((m, l) => m * prob(G, [l[2]]), 1); return [ks, ls.map(l => nm(l[1])).join(" + "), j, i]; });

  const total = games.length, flagged = games.filter(g => g.fl && g.fl.length).length;
  games = games.filter(g => {
    if (q && !`${g.h} ${g.a} ${g.lg}`.toLowerCase().includes(q)) return false;
    if (state.f === "sig") return g.fl && g.fl.length;
    if (state.f === "big") return big.has(g.ls);
    if (state.f === "live") return LIVE(g.st) || g.done;
    return true;
  });
  const groups = new Map();
  games.forEach(g => { if (!groups.has(g.ls)) groups.set(g.ls, { name: g.lg, games: [] }); groups.get(g.ls).games.push(g); });
  const rank = k => { const i = D.big.indexOf(k); return i < 0 ? 999 : i; };
  const ordered = [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || b[1].games.length - a[1].games.length);
  $("summary").innerHTML = `<span><b>${total}</b> games</span><span><b>${flagged}</b> with signals</span><span><b>${groups.size}</b> competitions shown</span>`;
  $("board").innerHTML = ordered.length ? ordered.map(([k, v]) => `<section class="league"><div class="lh"><h2>${esc(v.name)}</h2><span>${v.games.length}</span></div><div class="games">${v.games.map(g => `<div class="game">${rowHtml(g)}</div>`).join("")}</div></section>`).join("")
    : `<div class="empty">No games match. Try another filter.</div>`;
}

function renderRecord() {
  const P = D.perf || {}, L = P.live30 || {}, B = P.bt;
  const live = L.n ? `<div class="kv"><div><span>Graded games (30 days)</span><b>${L.n}</b></div><div><span>Winner pick</span><b>${pct(L.pick_accuracy, 1)}</b></div>
      <div><span>Over/under 2.5</span><b>${pct(L.ou25_accuracy, 1)}</b></div><div><span>BTTS</span><b>${pct(L.btts_accuracy, 1)}</b></div>
      <div><span>Exact score</span><b>${pct(L.exact_score, 1)}</b></div><div><span>1st half over 0.5</span><b>${pct(L.fh_o05_accuracy, 1)}</b></div></div>`
    : `<div class="note">Live grading starts as today's games finish. Every prediction is locked at kickoff and graded after full time.</div>`;
  const bt = B ? `<div class="note">Backtest (last 12 months, ${(B.matches || 0).toLocaleString()} matches, ${B.leagues} leagues, no odds): winner pick ${pct(B.pick_accuracy, 1)}, over/under 2.5 ${pct(B.ou25_accuracy, 1)}, BTTS ${pct(B.btts_accuracy, 1)}. Even betting markets pick the winner only about half the time; read the percentages, not just the picks.</div>` : "";
  const names = { split: "Big money vs tickets", line: "Line movement", rlm: "Reverse line movement", model: "Model higher than market", exchange: "Heavy exchange money" };
  const sig = (L.by_signal || []).length ? `<div class="tw"><table><tr><th>Signal</th><th class="num">Games</th><th class="num">Side won</th><th class="num">Market said</th></tr>${L.by_signal.map(x => `<tr><td>${names[x.kind] || esc(x.kind)}</td><td class="num">${x.n}</td><td class="num">${pct(x.side_won, 1)}</td><td class="num">${x.market_said == null ? "—" : pct(x.market_said, 1)}</td></tr>`).join("")}</table></div><div class="note">A signal helps if its side wins more often than the market's price expected, over many games.</div>` : "";
  const PK = (P.picks || []).filter(x => x.kind === "best");
  const pk = PK.length ? `<div class="tw"><table><tr><th>Best picks</th><th class="num">Picks</th><th class="num">Won</th><th class="num">Model said</th><th class="num">Return</th></tr>${PK.map(x => `<tr><td>${esc(x.tier)}</td><td class="num">${x.n}</td><td class="num">${pct(x.hit, 1)}</td><td class="num">${pct(x.model_said, 1)}</td><td class="num">${x.roi == null ? "—" : (x.roi > 0 ? "+" : "") + (x.roi * 100).toFixed(1) + "%"}</td></tr>`).join("")}</table></div><div class="note">Return is per 1-unit bet at the sportsbook price we had, on picks where we had one.</div>` : "";
  const K = P.kalshi;
  const kal = K && K.bets ? `<div class="kv"><div><span>Kalshi paper bets</span><b>${K.bets}</b></div><div><span>Won</span><b>${pct(K.won, 1)}</b></div><div><span>Avg price</span><b>${cents(K.avg_ask)}</b></div><div><span>Profit (1 contract each)</span><b>${K.profit >= 0 ? "+" : ""}$${K.profit.toFixed(2)}</b></div><div><span>Return</span><b>${(K.roi * 100).toFixed(1)}%</b></div></div>` : `<div class="note">Kalshi paper bets: none graded yet.</div>`;
  const BB = P.best_bets;
  const bbr = BB && BB.bets ? `<div class="tw"><table><tr><th>Best bets</th><th class="num">Bets</th><th class="num">Won</th><th class="num">Return per bet</th></tr>
      <tr><td><b>All</b></td><td class="num">${BB.bets}</td><td class="num">${pct(BB.won, 1)}</td><td class="num">${evTxt(BB.roi)}</td></tr>
      ${BB.clv_n ? `<tr><td colspan="4" class="note">Closing-line value: the first price shown beat the kickoff price in ${pct(BB.beat_close)} of ${BB.clv_n} bets (average ${evTxt(BB.clv)}). Consistently positive = a real edge from betting early.</td></tr>` : ""}
      ${Object.entries(BB.by_rating || {}).map(([k, v]) => `<tr><td><span class="rate ${rateCls(k)}">${esc(k)}</span></td><td class="num">${v.bets}</td><td class="num">${pct(v.won, 1)}</td><td class="num">${evTxt(v.roi)}</td></tr>`).join("")}</table></div>` : "";
  const OB = P.open_bets || [];
  const ob = OB.length ? `<div class="tw"><table><tr><th>Open paper bets</th><th>Where</th><th class="num">Price</th><th class="num">Chance</th><th class="num">Units</th></tr>${OB.map(b => `<tr><td>${esc(b.label)}<div class="note">${esc(b.game)} · ${new Date(b.t0 * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</div></td><td class="note">${esc(b.venue)}</td><td class="num">${b.venue === "Kalshi" ? Math.round(b.px * 100) + "¢" : amer(b.px)}</td><td class="num">${pct(b.p)}</td><td class="num">${b.units}</td></tr>`).join("")}</table></div><div class="note">Paper only: logged when first seen, priced again until kickoff (closing-line value), settled from the final score. No strategy here is proven; Kalshi's soccer prices have beaten every model rule tested so far.</div>` : "";
  const cl = D.cloud ? `<div class="note">Runs in the cloud every ~20 minutes (GitHub Actions), no PC needed. Last run: ${D.cloud.games} games, ${D.cloud.kalshi_games} on Kalshi, ${D.cloud.ratings_added} new results rated.</div>` : "";
  $("record").innerHTML = `<h2>Model record</h2>${live}${bbr}${kal}${ob}${pk}${sig}${bt}${cl}`;
}

$("days").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.day = b.dataset.d; document.querySelectorAll("#days button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
$("chips").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.f = b.dataset.f; store.set("sp_filter", state.f); document.querySelectorAll("#chips button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
document.querySelectorAll("#chips button").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === state.f));
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("board").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.set) { store.set(t.dataset.set, t.value); render(); return; }
  if (t.dataset.leg) { const s = state.combo[t.dataset.id] || (state.combo[t.dataset.id] = new Set()); t.checked ? s.add(t.dataset.leg) : s.delete(t.dataset.leg); render(); }
});
$("board").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.q) { (state.quote[t.dataset.id] = state.quote[t.dataset.id] || {})[t.dataset.q] = t.value; clearTimeout(window._qt); window._qt = setTimeout(() => { render(); const el = document.querySelector(`input[data-q="${t.dataset.q}"][data-id="${t.dataset.id}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 400); }
});
$("board").addEventListener("click", e => {
  const pa = e.target.closest("[data-padd]");
  if (pa) { const i = parlay.findIndex(x => x.id === pa.dataset.id && x.k === pa.dataset.padd); i >= 0 ? parlay.splice(i, 1) : parlay.push({ id: pa.dataset.id, k: pa.dataset.padd }); savePar(); return; }
  const pr = e.target.closest("[data-prem]");
  if (pr) { parlay.splice(+pr.dataset.prem, 1); savePar(); return; }
  if (e.target.closest("[data-pclear]")) { parlay = []; state.poffer = ""; savePar(); return; }
  const oc = e.target.closest(".ccard");
  if (oc) { const id = oc.dataset.open; if (oc.dataset.combo) state.combo[id] = new Set(oc.dataset.combo.split(","));
    state.open.add(id); const g = Object.values(D.days).flat().find(x => x.id === id);
    if (g && !(g.bb && g.bb.best && g.bb.best[5] !== "Overpriced")) { state.f = "all"; state.day = Object.keys(D.days).find(d => D.days[d].includes(g)); document.querySelectorAll("#chips button").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === "all")); renderHead(); }
    render(); setTimeout(() => document.querySelector(`[data-id="${id}"]`)?.scrollIntoView({ block: "start" }), 50); return; }
  const c = e.target.closest("[data-combo]");
  if (c) { e.preventDefault(); state.combo[c.dataset.id] = new Set(c.dataset.combo.split(",")); render(); return; }
});
$("board").addEventListener("click", e => { if (e.target.closest(".combo")) return; const r = e.target.closest(".row, .betcard"); if (!r) return; const id = r.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); });
$("board").addEventListener("input", e => {
  if (e.target.id !== "poffer") return;
  state.poffer = e.target.value; clearTimeout(window._pt);
  window._pt = setTimeout(() => { render(); const el = $("poffer"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 400);
});
$("pbar").addEventListener("click", () => { state.f = "parlay"; document.querySelectorAll("#chips button").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === "parlay")); render(); window.scrollTo(0, 0); });
renderHead(); render(); renderRecord();
// served live by the PC app: pick up fresh data every 5 minutes while the page is on screen
if (/\/phone\/?$/.test(location.pathname) || location.hostname.endsWith("github.io")) {
  setInterval(() => { if (document.visibilityState === "visible" && !state.open.size) location.reload(); }, 300000);
}

// Artifact relay: when this page is open in the Claude desktop app on the PC, the local "soccer"
// MCP server hands it fresh data and the page republishes its data.js, so every other view
// (the phone) reloads to the new board. Anywhere else use() resolves null and this does nothing.
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [mcp, art] = await Promise.all([claude.use("mcp"), claude.use("artifact")]).catch(() => []);
  if (!mcp || !art) return;
  const MIN_GAP = 600, STOP = new Set(["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed", "read_only_path"]);
  let published = D.generated, busy = false, pauseUntil = 0, unsub = null;
  const say = t => { state.relay = t; renderHead(); };
  unsub = mcp.watchTool("host:soccer", "get_board", null, async ev => {
    if (ev.type === "error") {
      const c = ev.error && ev.error.code;
      if (c === "server_not_connected") say(""); else say("PC link: " + (c || "error"));
      return;
    }
    const fresh = ev.result && ev.result.payload;
    if (!fresh || !fresh.days || !fresh.generated || fresh.generated < D.generated) return;
    if (fresh.generated > D.generated) { D = fresh; renderHead(); render(); renderRecord(); }
    if (busy || Date.now() < pauseUntil || fresh.generated - published < MIN_GAP) { say("live from PC"); return; }
    busy = true;
    try {
      await art.publish({ "data.js": "window.BOARD=" + JSON.stringify(fresh) + ";\n" });
      published = fresh.generated;
      say("live from PC, phone updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    } catch (e) {
      const c = e && e.code;
      if (c === "rate_limited") { pauseUntil = Date.now() + 1800000; say("publishing paused 30 min"); }
      else if (c === "conflict") { /* the view reloads to the newer version */ }
      else if (STOP.has(c)) { unsub && unsub(); say(""); }
      else { pauseUntil = Date.now() + 300000; say("publish failed: " + (c || "error")); }
    } finally { busy = false; }
  }, { refetchInterval: 300000 });
})();
</script>
